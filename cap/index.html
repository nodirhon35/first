<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кружка с кофе</title>
<style>
  :root {
    --bg: #475fa2;
    --floor: #e7e7ea;
    --mug: #ffffff;
    --mug-shade: #dfe3ea;
    --coffee: #591b1b;
    --steam: 255, 255, 255;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--floor);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow-x: auto;
  }

  /* Сцена 1000 x 500 */
  .scene {
    position: relative;
    flex: none;
    width: 1000px;
    height: 500px;
    background: radial-gradient(ellipse at 50% 60%, #373b46 0%, var(--bg) 70%);
    overflow: hidden;
  }

  /* Блюдце */
  .saucer {
    position: absolute;
    left: 350px; top: 420px;
    width: 300px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(#f4f6fa, #c9cfda);
    box-shadow: 0 14px 24px rgba(0,0,0,.45);
  }

  /* Ручка */
  .handle {
    position: absolute;
    left: 578px; top: 270px;
    width: 52px; height: 76px;
    border: 20px solid var(--mug);
    border-left: none;
    border-radius: 0 70px 70px 0;
    box-sizing: content-box;
  }

  /* Корпус */
  .mug {
    position: absolute;
    left: 400px; top: 252px;
    width: 200px; height: 190px;
    background: linear-gradient(90deg, var(--mug-shade) 0%, var(--mug) 30%, var(--mug) 70%, var(--mug-shade) 100%);
    border-radius: 0 0 90px 90px / 0 0 80px 80px;
  }

  /* Ободок и кофе */
  .rim {
    position: absolute;
    left: 400px; top: 232px;
    width: 200px; height: 42px;
    border-radius: 50%;
    background: var(--mug);
    box-shadow: inset 0 -3px 0 var(--mug-shade);
  }
  .coffee {
    position: absolute;
    left: 10px; top: 6px;
    width: 180px; height: 28px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 40% 35%, #1a1a1a 0%, var(--coffee) 60%);
    animation: ripple 3.2s ease-in-out infinite;
  }
  @keyframes ripple {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(.985, 1.06); }
  }

  /* Пар */
  .steam {
    position: absolute;
    left: 0; top: 0;
    width: 1000px; height: 250px;
    pointer-events: none;
  }
  .wisp {
    position: absolute;
    top: 190px;
    width: 26px; height: 110px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(var(--steam), .85) 0%, rgba(var(--steam), 0) 70%);
    filter: blur(9px);
    opacity: 0;
    animation: rise 4.5s ease-in infinite;
  }
  .wisp:nth-child(1) { left: 418px; animation-delay: 0s;   --dx: -30px; }
  .wisp:nth-child(2) { left: 440px; animation-delay: 1.1s; --dx: 26px;  }
  .wisp:nth-child(3) { left: 512px; animation-delay: 2.2s; --dx: -22px; }
  .wisp:nth-child(4) { left: 540px; animation-delay: 3.3s; --dx: 34px;  }
  .wisp:nth-child(5) { left: 496px; animation-delay: 1.8s; --dx: -38px; }

  @keyframes rise {
    0%   { transform: translate(0, 30px) scale(.6, .6);  opacity: 0; }
    20%  { opacity: .8; }
    55%  { transform: translate(calc(var(--dx) * .4), -80px) scale(1.2, 1.4); opacity: .55; }
    100% { transform: translate(var(--dx), -190px) scale(2, 2); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .wisp, .coffee { animation-duration: 12s; }
  }
</style>
</head>
<body>
  <div class="scene" role="img" aria-label="Белая кружка с чёрным кофе, из которой идёт белый пар">
    <div class="saucer"></div>
    <div class="handle"></div>
    <div class="mug"></div>
    <div class="rim"><div class="coffee"></div></div>
    <div class="steam">
      <span class="wisp"></span>
      <span class="wisp"></span>
      <span class="wisp"></span>
      <span class="wisp"></span>
      <span class="wisp"></span>
    </div>
  </div>
</body>
</html>
